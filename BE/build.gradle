plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '3.1.3'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'jacoco'
}

allprojects {
    group = 'com.honeymorning'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml') // ✅ HTML 리포트 경로
    }

    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect { fileTree(dir: it, exclude: [
                        '**/config/**',
                        '**/common/**',
                        '**/dto/**',
                        '**/client/**',
                        '**/exception/**',
                        '**/service/mapper/**'
                ]) })
        )
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            enabled = true
            element = 'CLASS'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
            }

            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
                maximum = 100
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
            }

            limit {
                counter = 'COMPLEXITY'
                value = 'COVEREDRATIO'
            }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java{
        sourceCompatibility = '17'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2022.0.4"
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport

        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"

            afterSuite { desc, result ->
                if (!desc.parent) {
                    println "\n=== Test Summary ==="
                    println "Total: ${result.testCount}, Passed: ${result.successfulTestCount}, Failed: ${result.failedTestCount}, Skipped: ${result.skippedTestCount}"
                    println "====================\n"
                }
            }
        }
    }

    tasks.jacocoTestReport {
        dependsOn test
    }

    tasks.check {
        dependsOn jacocoTestCoverageVerification
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport

        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"

            afterSuite { desc, result ->
                if (!desc.parent) {
                    println "\n=== Test Summary ==="
                    println "Total: ${result.testCount}, Passed: ${result.successfulTestCount}, Failed: ${result.failedTestCount}, Skipped: ${result.skippedTestCount}"
                    println "====================\n"
                }
            }
        }
    }

    tasks.jacocoTestReport {
        dependsOn test
    }

    tasks.check {
        dependsOn jacocoTestCoverageVerification
    }
}