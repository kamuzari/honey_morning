services:
  honeymorning_db:
    container_name: honeymorning_db
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: "1g"
    cpus: "1.5"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: honeymorning
      MYSQL_USER: honeymorning
      MYSQL_PASSWORD: honeymorning
      TZ: Asia/Seoul
    volumes:
      - ./infra/database/master-data:/var/lib/mysql
      - ./infra/database/replication/master.cnf:/etc/mysql/conf.d/my.cnf
      - ./infra/database/replication/master.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  honeymorning_read_only_db:
    container_name: honeymorning_read_only_db
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: "1g"
    cpus: "1.5"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: honeymorning
      MYSQL_USER: honeymorning
      MYSQL_PASSWORD: honeymorning
      TZ: Asia/Seoul
    volumes:
      - ./infra/database/slave-data:/var/lib/mysql
      - ./infra/database/replication/slave.cnf:/etc/mysql/conf.d/my.cnf
      - ./infra/database/replication/slave.sql:/tmp/slave.sql
      - ./infra/database/replication/warming/seed.sql:/tmp/seed.sql
    ports:
      - "3308:3306"
    depends_on:
      honeymorning_db:
        condition: service_healthy
    command: >
      bash -c "
        docker-entrypoint.sh mysqld &

        until mysql -u root -proot -e 'SELECT 1'; do
          echo 'MySQL is unavailable - sleeping'
          sleep 1
        done

        mysql -uroot -proot < /tmp/slave.sql &&

        echo 'Replication complete.'
        wait
      "

  event-db:
    container_name: event-db
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: "1g"
    cpus: "1.5"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_store
      MYSQL_USER: honeymorning
      MYSQL_PASSWORD: honeymorning
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - ./infra/database/mysql/event:/var/lib/mysql

  batch-app:
    container_name: batch-app
    build:
      context: ..
      dockerfile: batch/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD:-honeymorning}
    depends_on:
      honeymorning_db:
        condition: service_healthy
      event-db:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: batch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx-logs:/var/log/nginx
    depends_on:
      - batch-app

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: main_scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/ofelia/config.ini:/etc/ofelia/config.ini
    depends_on:
      - nginx

volumes:
  nginx-logs: