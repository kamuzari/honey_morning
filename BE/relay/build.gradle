springBoot {
    mainClass = 'com.honeymorning.relay.RelayApplication'
}

bootJar {
    enabled = true
    archiveClassifier = 'boot'
}

jar {
    enabled = true
    archiveClassifier = ''
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // ElasticSearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // AWS S3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.780'

    // RabbitMQ
    implementation 'org.springframework.boot:spring-boot-starter-amqp:3.4.2'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // LOMBOK
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'

    // Test Container
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:elasticsearch:1.19.8'
    testImplementation 'org.testcontainers:localstack'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:mysql'

    // Mock Exterior Server Test
    testImplementation 'org.springframework.cloud:spring-cloud-contract-stub-runner'
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock:4.0.4'

}