spring:
  application:
    name: honeymorning

  data:
    redis:
      connect-timeout: 30s
      timeout: 10s

  datasource:
    primary:
      url: jdbc:h2:mem:honeymorning;MODE=MySQL
      username: sa
      password:

    event:
      url: jdbc:h2:mem:honeymorning-event;MODE=MySQL
      username: sa
      password:

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
      type:
        descriptor:
          sql:
            BasicBinder: TRACE
    generate-ddl: true

  jwt:
    secret: ${TEST_JWT_SECRET:W2SwTG0AFmzMTa/30eyIfTLKgZDD7HSv2pIAGL43JCn1ITnOpSzCuGjRZ3IyybHY0BDmDHLAn9Veko7PHmLdWg==}

  sql:
    init:
      mode: always
