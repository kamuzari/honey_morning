springBoot {
    mainClass = 'com.honeymorning.api.ApiApplication'
}

bootJar {
    enabled = true
    archiveClassifier = 'boot'
}

jar {
    enabled = true
    archiveClassifier = ''
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // AWS S3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.780'

    // Jwt
    implementation 'com.auth0:java-jwt:3.18.1'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // Metric
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'

    // Rest Assured
    testImplementation 'io.rest-assured:rest-assured'

    // Mock Exterior Server Test
    testImplementation 'org.springframework.cloud:spring-cloud-contract-stub-runner'
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'
}