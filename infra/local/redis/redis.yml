version: "3.8"

services:
  redis:
    image: redis:6.2
    restart: unless-stopped
    mem_limit: "1g"
    cpus: "1.5"
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "6379:6379"