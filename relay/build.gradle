springBoot {
    mainClass = 'com.honeymorning.relay.RelayApplication'
}

bootJar {
    enabled = true
    archiveClassifier = 'boot'
}

jar {
    enabled = true
    archiveClassifier = ''
}

dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Feign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // ElasticSearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // AWS S3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.780'

    // RabbitMQ
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'

    // Test Container (module specific)
    testImplementation 'org.testcontainers:elasticsearch:1.19.8'
    testImplementation 'org.testcontainers:localstack'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:kafka'

    // Mock Exterior Server Test
    testImplementation 'org.springframework.cloud:spring-cloud-contract-stub-runner'
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'

}