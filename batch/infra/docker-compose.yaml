services:
  honeymorning_db:
    extends:
      file: database/mysql.yml
      service: honeymorning_db

  honeymorning_read_only_db:
    extends:
      file: database/mysql.yml
      service: honeymorning_read_only_db
    depends_on:
      - honeymorning_db

  event-db:
    extends:
      file: database/mysql.yml
      service: event-db

  batch-app:
    container_name: batch-app
    build:
      context: ../..
      dockerfile: batch/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD:-honeymorning}
    depends_on:
      honeymorning_db:
        condition: service_healthy
      event-db:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: batch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - nginx-logs:/var/log/nginx
    depends_on:
      - batch-app

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: main_scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ofelia/config.ini:/etc/ofelia/config.ini
    depends_on:
      - nginx
